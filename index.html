<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>План запуска — вход</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2b2a26;--sub:#6f6b62;--line:#ddd7ca;--accent:#7a6bb0;--err:#b5482e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--card:#282724;--ink:#eeeae2;--sub:#a9a499;--line:#3b3934;--accent:#a99be0;--err:#e07a5f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--sub);font-size:14px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
select,input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px}
.row{display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:14px;color:var(--sub)}
button{width:100%;margin-top:20px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--err)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>План запуска</h1>
  <p>Страница закрыта. Войдите, чтобы открыть.</p>
  <label for="who">Кто вы</label>
  <select id="who" name="username" autocomplete="username"></select>
  <label for="pw">Пароль</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="margin:0">Запомнить на этом устройстве</label></div>
  <button id="go" type="submit">Войти</button>
  <div id="msg" role="alert"></div>
</form>

const KEEP="plan-key", WHO="plan-who";
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const who=document.getElementById("who");
for(const name of Object.keys(V.users)){const o=document.createElement("option");o.textContent=name;who.append(o)}
if(store.get(WHO))who.value=store.get(WHO);

async function unwrap(name,password){
  const u=V.users[name];
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(u.salt),iterations:V.iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(u.iv)},kek,u8(u.key)));
}
async function open(raw,name){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(V.iv)},key,u8(V.data));
  const page=JSON.parse(new TextDecoder().decode(plain));
  // Имя для отметок «готово» — то же, под которым вошли (если ещё не задано).
  if(!store.get("miska-gh-name"))store.set("miska-gh-name",name);
  // Ключ для отметок зашифрован вместе с планом (решение CEO 14.10): после входа отмечать можно сразу.
  if(page.token)store.set("miska-gh-token",page.token);
  document.open();document.write(page.html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("go"),msg=document.getElementById("msg");
  btn.disabled=true;msg.textContent="";
  try{
    const raw=await unwrap(who.value,document.getElementById("pw").value);
    store.set(WHO,who.value);
    store.set(KEEP,document.getElementById("keep").checked?btoa(String.fromCharCode(...raw)):null);
    await open(raw,who.value);
  }catch(err){msg.textContent="Неверный пароль";btn.disabled=false}
});
// Запомненный вход — открываем, когда эта страница догрузилась: во время загрузки document.open() не срабатывает
// и план дописывался бы под формой. Пока открываем — форму прячем.
if(store.get(KEEP))document.getElementById("f").style.visibility="hidden";
addEventListener("load",async()=>{const k=store.get(KEEP);if(!k)return;
  try{await open(u8(k),store.get(WHO)||"")}catch(e){store.set(KEEP,null);document.getElementById("f").style.visibility=""}});
</script>
</body>
</html>
